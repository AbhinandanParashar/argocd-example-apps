replicaCount: 6
image:
  repository: nginx
  tag: "1.25"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: false
  annotations: {}
  path: /
  hosts:
  - chart-example.local
  tls: []
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
canary:
  steps:
  - setWeight: 20
  - pause:
      duration: 60s
  - setWeight: 50
  - pause:
      duration: 60s
  - setWeight: 100
